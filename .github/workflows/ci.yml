name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the "packageManager" field in package.json.
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
        env:
          # Build-time env validation only; no live Convex deployment is used.
          VITE_CONVEX_URL: "https://example.convex.cloud"
      - run: bun run check-types
      - run: bun run test

  e2e:
    name: E2E (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox
        working-directory: apps/web-e2e
      - name: Start local Convex backend
        working-directory: packages/backend
        env:
          # Account-free local deployment; no secrets needed.
          CONVEX_AGENT_MODE: anonymous
        run: |
          nohup bunx convex dev --tail-logs disable > "$RUNNER_TEMP/convex.log" 2>&1 &
          for _ in $(seq 1 60); do
            grep -q "Convex functions ready" "$RUNNER_TEMP/convex.log" && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/convex.log"
          exit 1
      - name: Sync e2e Pokémon from PokeAPI
        working-directory: packages/backend
        run: |
          bunx convex run sync:run '{"numbers":[1,25,133,1025]}'
          for _ in $(seq 1 30); do
            [ "$(bunx convex run pokemon:pokedex | jq length)" = 4 ] && exit 0
            sleep 2
          done
          echo "Sync did not finish"
          exit 1
      - run: bun run e2e
        working-directory: apps/web-e2e
        env:
          CI: "true"
          VITE_CONVEX_URL: "http://127.0.0.1:3210"
